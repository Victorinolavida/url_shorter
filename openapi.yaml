openapi: 3.0.3
info:
  title: URL Shorter API
  description: |
    Create short links, reuse existing active links, and redirect by code.

    Links can expire. An expired, disabled, or blocked code is reported as not found.
  version: 1.0.0
servers:
  - url: http://localhost:5100
    description: Local development
tags:
  - name: Health
  - name: Links
paths:
  /health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Check service health
      responses:
        "200":
          description: Service is healthy.
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /url-shorten:
    post:
      tags:
        - Links
      operationId: createShortUrl
      summary: Create or reuse a short URL
      description: |
        Creates a new short link for the given URL. If an active, unexpired link
        already exists for the same URL, the existing link is returned instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
            example:
              url: https://example.com/some/long/path
              expires_in: 24h
      responses:
        "200":
          description: Short URL created or reused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLinkResponse"
        "400":
          description: Invalid request body, URL, or expiration duration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Request body exceeds the 8 KiB limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /{code}:
    get:
      tags:
        - Links
      operationId: redirectToUrl
      summary: Redirect to the original URL
      parameters:
        - name: code
          in: path
          required: true
          description: Short link code.
          schema:
            type: string
            minLength: 4
            maxLength: 32
            pattern: "^[A-Za-z0-9]{4,32}$"
      responses:
        "303":
          description: Redirect to the original URL.
          headers:
            Location:
              description: Original URL.
              schema:
                type: string
                format: uri
        "404":
          description: Link not found, expired, disabled, or blocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    CreateLinkRequest:
      type: object
      additionalProperties: false
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          description: |
            Absolute HTTP or HTTPS URL. User info, unsupported schemes, and
            invalid ports are rejected.
          example: https://example.com/some/long/path
        expires_in:
          type: string
          nullable: true
          description: |
            Optional positive Go duration (for example `30m`, `24h`, or `7d` is
            not supported; use hours). Omit for a link that never expires.
          example: 24h
    CreateLinkResponse:
      type: object
      additionalProperties: false
      required:
        - url
        - expires_at
      properties:
        url:
          type: string
          format: uri
          description: Public short URL.
          example: http://localhost:5100/Ab3dE9f
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Expiration timestamp, or null when the link never expires.
          example: "2026-10-29T18:00:00Z"
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          example: something went wrong
